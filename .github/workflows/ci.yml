name: Reproducibility
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  synthetic-workflow:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RENV_CONFIG_REPOS_OVERRIDE: https://cloud.r-project.org
      MAKEFLAGS: -j2
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.3'
          use-public-rspm: true
      - uses: r-lib/actions/setup-tinytex@v2
      - name: Standard report packages
        run: tlmgr install geometry lmodern amsmath amsfonts booktabs tools hyperref
      - uses: r-lib/actions/setup-renv@v2
      - name: Unit and numerical tests
        run: Rscript tests/run_tests.R
      - name: Compile and sample all models on synthetic data
        run: Rscript scripts/run.R --mode demo --smoke
      - name: Render the synthetic report
        run: Rscript scripts/render.R --run demo
      - name: Confirm demo labeling
        run: Rscript -e 'm <- jsonlite::read_json("results/demo/manifest.json"); stopifnot(m$mode == "smoke", m$status == "demo", m$run_count == 3)'
      - name: Retain synthetic LaTeX and PDF reports
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-report
          path: |
            results/demo/report.tex
            results/demo/report.pdf
            results/demo/manifest.json
